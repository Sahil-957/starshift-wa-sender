<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#075e54" />
  <title>Table booking</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf6f2;color:#15332d;font:16px/1.45 system-ui,Segoe UI,sans-serif}.wrap{max-width:560px;margin:28px auto;padding:18px}.card{background:#fff;border:1px solid #d7e7e1;border-top:6px solid #ff7a45;border-radius:16px;padding:22px;box-shadow:0 12px 35px #0c3c3012}h1{font-size:23px;margin:0 0 7px}.sub{color:#58746d;margin:0 0 20px}label{display:block;font-weight:650;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #d7e7e1;border-radius:9px;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#08766a;color:white;font:700 16px inherit;cursor:pointer}button:disabled{opacity:.55}.hint{font-size:13px;color:#637d76;margin-top:6px}.status{margin-top:14px;white-space:pre-line}.success{background:#effaf3;border-radius:10px;padding:14px;margin-top:14px}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <h1 id="heading">Table booking</h1><p class="sub" id="intro">Join the queue at this branch.</p>
    <form id="form" class="hidden">
      <label for="name">Your name</label><input id="name" required maxlength="80" autocomplete="name" />
      <label for="number">WhatsApp mobile number</label><input id="number" required type="tel" inputmode="tel" autocomplete="tel" placeholder="Include country code, e.g. 919876543210" />
      <label for="members">Party size</label><input id="members" required type="number" min="1" max="30" value="2" />
      <p class="hint" id="hours"></p>
      <p class="hint">Allow location access when asked. Booking is accepted within 50 metres of this branch.</p>
      <button id="submit" type="submit">Check location and book table</button>
    </form>
    <a id="continue-whatsapp" class="hidden" style="display:block;text-align:center;text-decoration:none;padding:13px;border-radius:9px;background:#08766a;color:white;font-weight:700;margin-top:18px">Continue in WhatsApp to book</a>
    <div id="status" class="status" role="status"></div><div id="success" class="success hidden"></div>
  </section></main>
<script>
const params=new URLSearchParams(location.search), mobile=params.get('mobile')||'';let branchId=params.get('branch')||'';
const $=id=>document.getElementById(id);let branchInfo=null;
function hideToken(value){const bytes=new TextEncoder().encode(value);let hidden='\u2063';for(const byte of bytes)for(let bit=7;bit>=0;bit--)hidden+=(byte&(1<<bit))?'\u200c':'\u200b';return hidden+'\u2063'}
function welcomeText(template,shop,branch){return String(template||'Welcome to {{shop}}, {{branch}}!').replace(/\{\{\s*(shop|branch)\s*\}\}/gi,(_,key)=>key.toLowerCase()==='shop'?shop:branch)}
async function api(path,body){const r=await fetch('/api/table-booking/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.message||'Could not load booking.');return data}
(async()=>{
  try {
    const query={mobile};
    if(branchId) query.branch=branchId;
    else { query.lat=params.get('lat')||''; query.lon=params.get('lon')||''; }
    branchInfo=await api('branch?'+new URLSearchParams(query));
    branchId=branchInfo.branch.id;
    $('heading').textContent=branchInfo.shop+' ? '+branchInfo.branch.name;
    $('intro').textContent=`${welcomeText(branchInfo.welcome,branchInfo.shop,branchInfo.branch.name)} Your device location is checked automatically. No location message is needed in WhatsApp.`;
    $('hours').textContent=`Opening hours: ${branchInfo.branch.openTime}?${branchInfo.branch.closeTime}`;
    $('form').classList.add('hidden');
    $('status').textContent='Checking this device is within 50 metres of the branch?';
    const position=await new Promise((resolve,reject)=>{
      if(!navigator.geolocation) return reject(Error('This browser cannot verify location. Open the QR in your phone browser.'));
      navigator.geolocation.getCurrentPosition(resolve,()=>reject(Error('Location permission is needed to check that you are at this branch. Allow location access and reload the QR page.')),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
    });
    const check=await api('location-check',{mobile,branchId,latitude:position.coords.latitude,longitude:position.coords.longitude});
    if(!/^\d{7,15}$/.test(check.whatsappNumber||'')) throw Error('The branch WhatsApp is not connected. Please contact the shop.');
    $('status').textContent=`Location verified (${check.distanceMeters} m). Opening WhatsApp?`;
    const invisible=hideToken(check.token);
    const whatsappText=`table book ${branchInfo.branch.name}${invisible}`;
    const whatsappUrl=`https://wa.me/${encodeURIComponent(check.whatsappNumber)}?text=${encodeURIComponent(whatsappText)}`;
    window.location.replace(whatsappUrl);
  } catch(error) {
    $('form').classList.add('hidden');
    $('status').textContent=error.message||String(error);
  }
})();
$('form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;$('status').textContent='Checking your location…';try{const position=await new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error('Location is not available in this browser.'));navigator.geolocation.getCurrentPosition(resolve,()=>reject(Error('Please allow location access and try again.')),{enableHighAccuracy:true,timeout:15000,maximumAge:0});});$('status').textContent='Confirming your queue number…';const result=await api('book',{mobile,branchId,name:$('name').value,number:$('number').value,members:$('members').value,latitude:position.coords.latitude,longitude:position.coords.longitude});$('form').classList.add('hidden');$('status').textContent='';const b=result.booking;$('success').classList.remove('hidden');$('success').textContent=`${result.welcome}\n\nQueue number: ${b.queueNo}\nBranch: ${b.branchName}\nParty size: ${b.members}\nEstimated wait: ${b.estimatedWaitMinutes} minutes${result.alertSent?'':'\n\nYour booking is recorded, but the branch WhatsApp alert could not be sent.'}`;}catch(error){$('status').textContent=error.message||String(error);}finally{btn.disabled=false;}});
</script>
</body>
</html>
